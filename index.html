<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>广告账户与卡片</title><style>body{font:16px "Microsoft YaHei",sans-serif;max-width:1000px;margin:5vh auto;padding:20px;color:#203144;background:#f6f8fb}input,button{font:inherit;padding:8px;margin:4px}table{background:white;width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:10px}button{cursor:pointer}</style><h1>广告账户与卡片</h1><p>为每张卡分配唯一编号，例如 K001。只登记尾号，完整卡号和安全码请留在发卡平台。</p><form id="entry"><input id="account" required pattern="[0-9]+" placeholder="广告账户 ID（数字）" aria-label="广告账户 ID"><input id="alias" placeholder="账户名称" aria-label="账户名称"><input id="card" required placeholder="卡片唯一编号，如 K001" aria-label="卡片编号"><input id="digits" required pattern="[0-9]{4}" maxlength="4" placeholder="卡尾四位" aria-label="卡尾四位"><button>保存绑定</button></form><p><input id="query" type="search" placeholder="搜索账户、卡编号或尾号" aria-label="搜索"><button id="backup">导出备份</button><button id="restore">导入备份</button><input id="file" type="file" accept=".json" hidden></p><table><thead><tr><th>账户 ID<th>账户名称<th>卡编号<th>尾号<th>操作<tbody id="rows"></table><p id="count"></p><script>
const key='ad-card-directory-v1', el=id=>document.getElementById(id);
function validate(list){if(!Array.isArray(list))throw Error();let accounts=new Set(),cards=new Set();for(const r of list){if(!Array.isArray(r)||r.length!==4||!r.every(x=>typeof x==='string')||!/^\d+$/.test(r[0])||!r[2].trim()||!/^\d{4}$/.test(r[3])||accounts.has(r[0])||cards.has(r[2].trim().toLowerCase()))throw Error();accounts.add(r[0]);cards.add(r[2].trim().toLowerCase())}return list}
let data=validate(JSON.parse(localStorage.getItem(key)||'[]'));
function save(next){try{validate(next);localStorage.setItem(key,JSON.stringify(next));data=next;draw();return true}catch{alert('无法保存。请检查账户 ID 或卡编号是否重复，以及浏览器是否允许本地存储。')}}
function draw(){let body=el('rows');body.replaceChildren();let q=el('query').value.trim().toLowerCase();for(const r of data.filter(r=>r.some(x=>x.toLowerCase().includes(q)))){let tr=body.insertRow();for(const x of r)tr.insertCell().textContent=x;let b=document.createElement('button');b.textContent='解除登记';b.onclick=()=>{if(confirm('解除账户 '+r[0]+' 与 '+r[2]+' 的本地登记？'))save(data.filter(x=>x!==r))};tr.insertCell().append(b)}el('count').textContent='当前显示 '+body.rows.length+' 条，共 '+data.length+' 条'}
el('entry').onsubmit=e=>{e.preventDefault();let r=['account','alias','card','digits'].map(id=>el(id).value.trim());if(save([...data,r]))e.target.reset()};el('query').oninput=draw;
el('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='广告账户卡片备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
el('restore').onclick=()=>el('file').click();el('file').onchange=async e=>{try{let list=validate(JSON.parse(await e.target.files[0].text()));if(confirm('用备份中的 '+list.length+' 条记录替换当前登记？'))save(list)}catch{alert('备份格式错误或包含重复绑定。')}e.target.value=''};draw()</script></html>
