<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>广告账户与卡片</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html{background:#f2f5f6}body{max-width:1140px;margin:0 auto;padding:clamp(20px,5vw,64px) 20px;font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif;color:#21343c}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.035em;margin:0}h1+p{color:#52656c;margin:8px 0 25px}h2{font-size:19px;margin:0 0 15px}section{background:white;border:1px solid #d6e0e2;border-radius:14px;padding:clamp(16px,3vw,27px);margin-bottom:18px}form,.toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}label{display:grid;gap:5px;flex:1 1 145px;color:#40565d;font-size:14px}input,button{font:inherit;border-radius:7px;padding:9px 12px;min-height:42px}input{width:100%;min-width:0;border:1px solid #aebfc4;background:#fcfdfd;color:#21343c}button{background:white;color:#244b52;border:1px solid #b1c3c7;cursor:pointer}button:hover{background:#edf5f4}form button{background:#11675b;color:white;border-color:#11675b}form button:hover{background:#0a5248}:focus-visible{outline:3px solid #369b90;outline-offset:2px}.toolbar{align-items:center;margin-bottom:16px}.toolbar input[type=search]{flex:1 1 240px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:12px;text-align:left;border-bottom:1px solid #e1e8e9}th{background:#f3f7f7;color:#52676c;font-size:14px}td button{font-size:14px;min-height:34px;padding:4px 9px}#count{color:#536970;font-size:14px;margin:12px 0 0}@media(max-width:520px){body{padding:22px 12px}label{flex-basis:calc(50% - 10px)}form button{width:100%}.toolbar input[type=search]{flex-basis:100%}}</style><h1>广告账户与卡片</h1><p>为每张卡分配唯一编号，例如 K001。只登记尾号，完整卡号和安全码请留在发卡平台。</p><section><h2>新增绑定</h2><form id="entry"><label>广告账户 ID<input id="account" required pattern="[0-9]+" placeholder="广告账户 ID（数字）" aria-label="广告账户 ID"></label><label>账户名称（选填）<input id="alias" placeholder="账户名称" aria-label="账户名称"></label><label>卡片编号<input id="card" required placeholder="卡片唯一编号，如 K001" aria-label="卡片编号"></label><label>卡片尾号<input id="digits" required pattern="[0-9]{4}" maxlength="4" placeholder="卡尾四位" aria-label="卡尾四位"></label><button>保存绑定</button></form></section><section><h2>绑定清单</h2><div class="toolbar"><input id="query" type="search" placeholder="搜索账户、卡编号或尾号" aria-label="搜索"><button id="backup">导出备份</button><button id="restore">导入备份</button><input id="file" type="file" accept=".json" hidden></div><div class="scroll"><table><thead><tr><th>账户 ID<th>账户名称<th>卡编号<th>尾号<th>操作<tbody id="rows"></table></div><p id="count" aria-live="polite"></p></section><script>
const key='ad-card-directory-v1', el=id=>document.getElementById(id);
function validate(list){if(!Array.isArray(list))throw Error();let accounts=new Set(),cards=new Set();for(const r of list){if(!Array.isArray(r)||r.length!==4||!r.every(x=>typeof x==='string')||!/^\d+$/.test(r[0])||!r[2].trim()||!/^\d{4}$/.test(r[3])||accounts.has(r[0])||cards.has(r[2].trim().toLowerCase()))throw Error();accounts.add(r[0]);cards.add(r[2].trim().toLowerCase())}return list}
let data=validate(JSON.parse(localStorage.getItem(key)||'[]'));
function save(next){try{validate(next);localStorage.setItem(key,JSON.stringify(next));data=next;draw();return true}catch{alert('无法保存。请检查账户 ID 或卡编号是否重复，以及浏览器是否允许本地存储。')}}
function draw(){let body=el('rows');body.replaceChildren();let q=el('query').value.trim().toLowerCase();for(const r of data.filter(r=>r.some(x=>x.toLowerCase().includes(q)))){let tr=body.insertRow();for(const x of r)tr.insertCell().textContent=x;let b=document.createElement('button');b.textContent='解除登记';b.onclick=()=>{if(confirm('解除账户 '+r[0]+' 与 '+r[2]+' 的本地登记？'))save(data.filter(x=>x!==r))};tr.insertCell().append(b)}if(!body.rows.length){const cell=body.insertRow().insertCell();cell.colSpan=5;cell.textContent=q?'没有匹配的登记，请尝试其他关键词。':'暂无登记，添加第一条绑定后即可在这里查询。';el('count').textContent='共 '+data.length+' 条';return}el('count').textContent='当前显示 '+body.rows.length+' 条，共 '+data.length+' 条'}
el('entry').onsubmit=e=>{e.preventDefault();let r=['account','alias','card','digits'].map(id=>el(id).value.trim());if(save([...data,r]))e.target.reset()};el('query').oninput=draw;
el('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='广告账户卡片备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
el('restore').onclick=()=>el('file').click();el('file').onchange=async e=>{try{let list=validate(JSON.parse(await e.target.files[0].text()));if(confirm('用备份中的 '+list.length+' 条记录替换当前登记？'))save(list)}catch{alert('备份格式错误或包含重复绑定。')}e.target.value=''};draw()</script></html>
